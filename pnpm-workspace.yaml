packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # SQLite Adapter 通过独立 Worker 加载原生驱动。
  better-sqlite3: true
  # esbuild 是 Vite、Vitest 与 tsup 的构建器，只允许其安装本机二进制。
  esbuild: true

catalog:
  "@eslint/js": 10.0.1
  "@fastify/static": 10.1.2
  "@fastify/websocket": 11.3.0
  "@openai/codex": 0.146.0
  "@playwright/test": 1.62.0
  "@sinclair/typebox": 0.34.52
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-query": 5.101.4
  "@tanstack/react-router": 1.170.18
  "@types/node": 26.1.2
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@types/better-sqlite3": 7.6.13
  "@types/ws": 8.18.1
  "@vitejs/plugin-react": 6.0.4
  "@vitest/coverage-v8": 4.1.10
  ansi-to-react: 6.2.6
  better-sqlite3: 13.0.2
  dependency-cruiser: 18.1.0
  eslint: 10.8.0
  eslint-config-prettier: 10.1.8
  fastify: 5.10.0
  globals: 17.8.0
  lucide-react: 1.27.0
  pino: 10.3.1
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  tsup: 8.5.1
  tailwindcss: 4.3.3
  typescript: 6.0.2
  typescript-eslint: 8.65.0
  vite: 8.1.5
  vitest: 4.1.10
  ws: 8.21.1
  streamdown: 2.5.0
  shiki: 4.3.1
  "@pierre/diffs": 1.2.12
  zustand: 5.0.14

catalogMode: strict
cleanupUnusedCatalogs: true
autoInstallPeers: false
linkWorkspacePackages: false
minimumReleaseAgeExclude:
  - "@openai/codex@0.145.0-darwin-arm64 || 0.145.0-darwin-x64 || 0.145.0-linux-arm64 || 0.145.0-linux-x64 || 0.145.0-win32-arm64 || 0.145.0-win32-x64 || 0.145.0"
  - prettier@3.9.6
  - react-dom@19.2.8
  - react@19.2.8
  - "@tanstack/query-core@5.101.4"
  - "@tanstack/react-query@5.101.4"
preferWorkspacePackages: true
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true
