# 窗口只能通过 capability 引用对应集合，新增命令不会自动获得调用权限。

[[set]]
identifier = "main-window-commands"
description = "Allows the main window to call the application commands used by the workbench."
permissions = [
  "allow-initialize-app-storage",
  "allow-update-app-preferences",
  "allow-list-custom-backgrounds",
  "allow-read-custom-background",
  "allow-update-custom-backgrounds",
  "allow-connect-runtime",
  "allow-start-runtime",
  "allow-inspect-codex-runtime",
  "allow-install-codex-runtime",
  "allow-get-app-info",
  "allow-get-runtime-performance-metrics",
  "allow-get-running-tasks",
  "allow-sync-desktop-pet",
  "allow-get-workbench-background",
  "allow-list-workbench-pets",
  "allow-download-workbench-pet",
  "allow-list-models",
  "allow-get-provider-connection",
  "allow-start-official-provider-login",
  "allow-cancel-provider-login",
  "allow-configure-custom-provider",
  "allow-logout-provider",
  "allow-get-global-settings",
  "allow-update-global-settings",
  "allow-get-project-defaults",
  "allow-update-project-defaults",
  "allow-list-skills",
  "allow-list-mcp-servers",
  "allow-retry-mcp-servers",
  "allow-list-projects",
  "allow-add-project",
  "allow-rename-project",
  "allow-remove-project",
  "allow-reorder-projects",
  "allow-list-project-directories",
  "allow-list-tasks",
  "allow-read-task",
  "allow-start-task",
  "allow-start-turn",
  "allow-steer-turn",
  "allow-interrupt-turn",
  "allow-resolve-pending-request",
  "allow-start-review",
  "allow-compact-task",
  "allow-fork-task",
  "allow-get-task-settings",
  "allow-update-task-settings",
  "allow-update-task-goal",
  "allow-clear-task-goal",
  "allow-upload-feedback",
  "allow-list-background-terminals",
  "allow-terminate-background-terminal",
  "allow-list-queued-submissions",
  "allow-add-queued-submission",
  "allow-update-queued-submission",
  "allow-delete-queued-submission",
  "allow-reorder-queued-submissions",
  "allow-start-queued-submission",
  "allow-list-project-files",
  "allow-search-project-files",
  "allow-stop-project-file-search",
  "allow-rename-project-file",
  "allow-delete-project-file",
  "allow-read-project-source-file",
  "allow-get-project-git-status",
  "allow-get-project-git-history",
  "allow-get-project-git-commit-files",
  "allow-get-project-git-commit-file-diff",
  "allow-switch-project-branch",
  "allow-create-project-branch",
  "allow-list-project-worktrees",
  "allow-create-project-worktree",
  "allow-switch-project-worktree",
  "allow-generate-commit-message",
  "allow-commit-project-changes",
  "allow-upload-attachment",
  "allow-import-host-attachment",
  "allow-cache-project-image",
  "allow-list-host-files",
  "allow-get-project-open-capabilities",
  "allow-open-project",
  "allow-open-task-attachment",
  "allow-rename-task",
  "allow-pin-task",
  "allow-archive-task",
  "allow-unarchive-task",
  "allow-unsubscribe-task",
  "allow-delete-task",
]

[[set]]
identifier = "desktop-pet-window-commands"
description = "Allows the desktop pet window to call only its rendering and navigation commands."
permissions = [
  "allow-get-desktop-pet-state",
  "allow-get-desktop-pet-drag-strategy",
  "allow-get-desktop-pet-position",
  "allow-show-desktop-pet",
  "allow-set-desktop-pet-drag-position",
  "allow-start-desktop-pet-native-drag",
  "allow-move-desktop-pet",
  "allow-layout-desktop-pet",
  "allow-open-desktop-pet-task",
  "allow-list-workbench-pets",
]
