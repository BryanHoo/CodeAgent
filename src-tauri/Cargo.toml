[package]
name = "codeagent"
version = "0.1.0"
description = "CodeAgent desktop runtime"
edition = "2024"
rust-version = "1.97"

[lib]
name = "codeagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.32"
ignore = "0.4"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
thiserror = "2.0.20"
tokio = { version = "1.50.0", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
macos-panel-activation = { path = "native/macos-panel-activation" }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
