name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 显式展示 Codex 协议漂移；pnpm check 继续保留同一门禁作为本地统一入口。
      - name: Verify Codex Schema baseline
        run: pnpm run codex:schema:check
      - name: Run quality gates
        run: pnpm check
      # 只读展示质量门禁生成的机器报告，不再次分析 production 产物。
      - name: Show Web Bundle report
        run: pnpm run bundle:report

  macos-smoke:
    name: macOS smoke
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 在真实 Darwin runner 上验证 Web 目录浏览、原生 Codex 包解析与宿主命令分支，不重复完整 E2E。
      - name: Run macOS smoke tests
        run: |
          test_files=(
            packages/server/src/project-directory-browser.test.ts
            apps/web/src/features/projects/components/project-directory-picker-dialog.test.tsx
            src/system-browser.test.ts
            packages/server/src/project-open.test.ts
            packages/provider-codex/src/binary.test.ts
          )
          # Vitest 会忽略不存在的过滤项，运行前必须逐项校验。
          for test_file in "${test_files[@]}"; do
            if [[ ! -f "${test_file}" ]]; then
              echo "::error file=${test_file}::Missing macOS smoke test file"
              exit 1
            fi
          done
          pnpm exec vitest run "${test_files[@]}"

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        run: pnpm test:e2e
