name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub release and npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if [[ "v${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi
      - name: Run quality gates
        run: pnpm check
      - name: Publish with provenance
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping pnpm publish."
          else
            pnpm publish --access public --provenance --no-git-checks
          fi
        env:
          # 绑定 npm Trusted Publisher 后删除该 Secret，OIDC 会自动接管。
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "CodeAgent ${GITHUB_REF_NAME}" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
