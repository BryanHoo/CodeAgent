name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml

  native-webview:
    name: Native WebView Gate
    permissions:
      contents: read
    uses: ./.github/workflows/webview.yml
    with:
      run_performance: true

  release:
    name: ${{ matrix.name }}
    needs: [quality, native-webview]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 Portable
            platform: windows-latest
            args: --no-bundle --no-sign --ci
            rustTargets: ""
            uploadPlainBinary: true
            uploadUpdaterArtifacts: false
            releaseAssetNamePattern: "[name]_[version]_[arch]_portable[ext]"
          - name: Windows x64 NSIS
            platform: windows-latest
            args: --bundles nsis --ci
            rustTargets: ""
            uploadPlainBinary: false
            uploadUpdaterArtifacts: true
            releaseAssetNamePattern: ""
          - name: Ubuntu x64 DEB and AppImage
            platform: ubuntu-24.04
            args: --bundles deb,appimage --ci
            rustTargets: ""
            uploadPlainBinary: false
            uploadUpdaterArtifacts: true
            releaseAssetNamePattern: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg --ci
            rustTargets: aarch64-apple-darwin
            uploadPlainBinary: false
            uploadUpdaterArtifacts: true
            releaseAssetNamePattern: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xdg-utils

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: pnpm version:check

      - name: Read release notes
        id: release-notes
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release-notes.mjs >> "$GITHUB_OUTPUT"

      - name: Build and upload release artifacts
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: CodeAgent v__VERSION__
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: ${{ matrix.uploadUpdaterArtifacts }}
          uploadUpdaterSignatures: ${{ matrix.uploadUpdaterArtifacts }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          uploadWorkflowArtifacts: true
          releaseAssetNamePattern: ${{ matrix.releaseAssetNamePattern }}
          args: ${{ matrix.args }}
