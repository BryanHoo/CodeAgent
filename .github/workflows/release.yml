name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64, bundles: dmg }
          - { os: ubuntu-22.04, target: linux-x64-gnu, bundles: "deb,appimage" }
          - { os: windows-2022, target: win32-x64-msvc, bundles: "msi,nsis" }
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release version
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          test "v${package_version}" = "${RELEASE_TAG}" || {
            echo "Release tag ${RELEASE_TAG} does not match ${package_version}." >&2
            exit 1
          }
          pnpm run release:version:check
      - name: Build and test npm artifacts
        run: pnpm build && pnpm run package:check
      - name: Prepare bundled Codex runtime
        run: pnpm --filter @code-agent/desktop prepare:codex
      - name: Prepare Apple notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          for secret_name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${secret_name}" >&2
              exit 1
            fi
          done
          key_path="${RUNNER_TEMP}/app-store-connect-private-key.p8"
          umask 077
          printf '%s' "${APPLE_API_PRIVATE_KEY}" > "${key_path}"
          chmod 600 "${key_path}"
          test -s "${key_path}"
          echo "APPLE_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"
      - name: Build and upload signed macOS Desktop artifacts
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "CodeAgent ${{ env.RELEASE_TAG }} (Windows Desktop: Preview / Unsigned)"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
      - name: Build and upload Desktop artifacts
        if: runner.os == 'Linux'
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "CodeAgent ${{ env.RELEASE_TAG }} (Windows Desktop: Preview / Unsigned)"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
      - name: Build and upload Windows Desktop (Preview / Unsigned)
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "CodeAgent ${{ env.RELEASE_TAG }} (Windows Desktop: Preview / Unsigned)"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
      - name: Verify macOS signatures and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(target/release/bundle/macos/*.app)
          dmgs=(target/release/bundle/dmg/*.dmg)
          test "${#apps[@]}" -eq 1
          test "${#dmgs[@]}" -eq 1
          app_bundle="${apps[0]}"
          dmg_bundle="${dmgs[0]}"
          test "$(plutil -extract LSMinimumSystemVersion raw "${app_bundle}/Contents/Info.plist")" = "14.0"
          codesign --verify --deep --strict --verbose=2 "${app_bundle}"
          signed_entitlements="${RUNNER_TEMP}/code-agent-signed-entitlements.plist"
          codesign -d --entitlements "${signed_entitlements}" --xml "${app_bundle}"
          # App Sandbox 必须保持关闭；任务隔离由 Codex sandboxPolicy 负责。
          if /usr/libexec/PlistBuddy -c "Print :com.apple.security.app-sandbox" "${signed_entitlements}" 2>/dev/null | grep -qx "true"; then
            echo "Signed macOS app unexpectedly enables App Sandbox." >&2
            exit 1
          fi
          codesign --verify --strict --verbose=2 "${dmg_bundle}"
          xcrun stapler validate "${app_bundle}"
          spctl --assess --type execute --verbose=4 "${app_bundle}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg_bundle}"
      - name: Verify Desktop artifact isolation
        run: pnpm run desktop:artifact:check
      - name: Pack npm artifacts
        shell: bash
        run: |
          mkdir -p .artifacts
          pnpm --dir "packages/node-binding-${{ matrix.target }}" pack --pack-destination ../../.artifacts
          if [[ "${{ matrix.target }}" = "linux-x64-gnu" ]]; then
            pnpm --dir apps/node-cli pack --pack-destination ../../.artifacts
          fi
          tar -czf ".artifacts/code-agent-desktop-${{ matrix.target }}.tar.gz" -C target/release/bundle .
      - name: Upload npm artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-${{ matrix.target }}
          path: .artifacts/*.tgz
          if-no-files-found: error
          compression-level: 0
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-${{ matrix.target }}
          path: .artifacts/code-agent-desktop-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  smoke-hosted:
    name: Smoke ${{ matrix.target }} on minimum OS
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: darwin-arm64, script: smoke-desktop-macos.sh }
          - { os: ubuntu-22.04, target: linux-x64-gnu, script: smoke-desktop-linux.sh }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install Ubuntu smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Download npm artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: npm-*
          path: .artifacts/npm
          merge-multiple: true
      - name: Download Desktop artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: desktop-${{ matrix.target }}
          path: .artifacts/desktop
      - name: Smoke packaged CLI
        run: node tools/release/smoke-cli.mjs --artifacts .artifacts/npm --target ${{ matrix.target }}
      - name: Smoke installed Desktop
        shell: bash
        run: >-
          bash "tools/release/${{ matrix.script }}"
          ".artifacts/desktop/code-agent-desktop-${{ matrix.target }}.tar.gz"

  smoke-windows-10:
    name: Smoke win32-x64-msvc on Windows 10
    needs: build
    runs-on: [self-hosted, Windows, X64, windows-10]
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download npm artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: npm-*
          path: .artifacts/npm
          merge-multiple: true
      - name: Download Desktop artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: desktop-win32-x64-msvc
          path: .artifacts/desktop
      - name: Smoke packaged CLI
        run: node tools/release/smoke-cli.mjs --artifacts .artifacts/npm --target win32-x64-msvc
      - name: Smoke installed Desktop
        shell: pwsh
        run: >-
          ./tools/release/smoke-desktop-windows.ps1
          -ArchivePath .artifacts/desktop/code-agent-desktop-win32-x64-msvc.tar.gz

  release-approval:
    name: Approve updater acceptance
    needs: [smoke-hosted, smoke-windows-10]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Record approved release
        shell: bash
        run: |
          test -n "${RELEASE_TAG}"
          echo "Updater acceptance approved for ${RELEASE_TAG}."

  publish:
    name: Publish verified artifacts
    needs: [build, release-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download npm artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: npm-*
          path: .artifacts/npm
          merge-multiple: true
      - name: Download desktop artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: desktop-*
          path: .artifacts/desktop
          merge-multiple: true
      - name: Verify complete artifact set
        shell: bash
        run: |
          package_version="${RELEASE_TAG#v}"
          targets=(darwin-arm64 linux-x64-gnu win32-x64-msvc)
          for target in "${targets[@]}"; do
            test -f ".artifacts/npm/bryanhu-code-agent-${target}-${package_version}.tgz" || exit 1
          done
          test -f ".artifacts/npm/bryanhu-code-agent-${package_version}.tgz" || exit 1
          find .artifacts/npm .artifacts/desktop -type f -print0 | sort -z | xargs -0 shasum -a 256 > .artifacts/SHA256SUMS
      - name: Publish native packages before the CLI
        shell: bash
        run: |
          package_version="${RELEASE_TAG#v}"
          for target in darwin-arm64 linux-x64-gnu win32-x64-msvc; do
            name="@bryanhu/code-agent-${target}"
            tarball=".artifacts/npm/bryanhu-code-agent-${target}-${package_version}.tgz"
            npm view "${name}@${package_version}" version --json >/dev/null 2>&1 || npm publish "${tarball}" --access public --provenance
          done
      - name: Publish main CLI package
        shell: bash
        run: |
          package_version="${RELEASE_TAG#v}"
          npm view "@bryanhu/code-agent@${package_version}" version --json >/dev/null 2>&1 || npm publish ".artifacts/npm/bryanhu-code-agent-${package_version}.tgz" --access public --provenance
      - name: Upload release checksums and Desktop archives
        shell: bash
        run: >-
          gh release upload "${RELEASE_TAG}"
          .artifacts/desktop/*.tar.gz .artifacts/SHA256SUMS
          --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Promote verified GitHub Release
        shell: bash
        run: gh release edit "${RELEASE_TAG}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
