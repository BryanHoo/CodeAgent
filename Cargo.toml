[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/core",
  "crates/node-binding",
  "crates/platform",
  "crates/protocol",
  "crates/protocol-gen",
  "crates/provider-codex",
  "crates/runtime",
]
resolver = "3"

[workspace.package]
version = "1.9.0"
authors = ["BryanHu"]
edition = "2024"
license = "MIT"
repository = "https://github.com/BryanHoo/CodeAgent"
rust-version = "1.88"

[workspace.dependencies]
code-agent-core = { path = "crates/core" }
code-agent-platform = { path = "crates/platform" }
code-agent-protocol = { path = "crates/protocol" }
code-agent-provider-codex = { path = "crates/provider-codex" }
code-agent-runtime = { path = "crates/runtime" }
serde = { version = "=1.0.229" }
tauri = { version = "=2.11.5" }
tauri-build = { version = "=2.6.3" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
