[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/core",
  "crates/node-binding",
  "crates/platform",
  "crates/protocol",
  "crates/protocol-gen",
  "crates/provider-codex",
  "crates/runtime",
]
resolver = "3"

[workspace.package]
version = "1.9.0"
authors = ["BryanHu"]
edition = "2024"
license = "MIT"
repository = "https://github.com/BryanHoo/CodeAgent"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "=0.1.89"
chrono = { version = "=0.4.44", default-features = false, features = ["serde", "std"] }
code-agent-core = { path = "crates/core" }
code-agent-platform = { path = "crates/platform" }
code-agent-protocol = { path = "crates/protocol" }
code-agent-provider-codex = { path = "crates/provider-codex" }
code-agent-runtime = { path = "crates/runtime" }
serde = { version = "=1.0.229" }
serde_json = { version = "=1.0.150" }
jsonschema = { version = "=0.49.2", default-features = false }
nix = { version = "=0.30.1", default-features = false, features = ["signal"] }
percent-encoding = "=2.3.2"
regress = "=0.11.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "=0.37.0", features = ["backup", "bundled"] }
sha2 = "=0.10.9"
tauri = { version = "=2.11.5" }
tauri-build = { version = "=2.6.3" }
thiserror = "=2.0.18"
tokio = { version = "=1.49.0", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
unicode-normalization = "=0.1.25"
uuid = { version = "=1.24.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
